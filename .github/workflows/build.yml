name: Build VSIX

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Changed-line coverage compares the PR merge commit with the exact
          # base SHA. The default depth of 1 omits that parent and makes
          # `git diff <base>...HEAD` fail before the real checks can run.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run verify

      - name: Extension Host integration
        run: xvfb-run -a npm run test:extension-host

      - name: Package VSIX
        run: npm run package:vsix

      - name: Validate VSIX contents
        run: npm run check:vsix
